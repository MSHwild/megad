name: Test & Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install yara-python
      - name: Download YARA rules for tests
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/YARAHQ/yara-forge/releases/latest/download/yara-forge-rules-core.zip -OutFile yf.zip
          Expand-Archive yf.zip yf
          $rule = (Get-ChildItem yf -Recurse -Filter *.yar | Select-Object -First 1).FullName
          "MAEGUARD_TEST_YARA=$rule" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run tests
        run: python tests/test_maeguard.py
        env:
          PYTHONIOENCODING: utf-8

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1 yara-python pystray pillow
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name MaeGuard --icon icon.ico
          --hidden-import yara --hidden-import pystray._win32
          --add-data "signatures.txt;." --add-data "icon.ico;."
          --add-data "assets\mark_small.png;assets"
          maeguard_gui.py
      - run: copy signatures.txt dist\
        shell: cmd
      - name: Build installer
        run: |
          choco install nsis -y --no-progress
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 installer.nsi
      - name: Installer smoke test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\MaeGuard_Setup_*.exe).FullName
          Start-Process $setup -ArgumentList "/S" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\MaeGuard"
          foreach ($f in "MaeGuard.exe","signatures.txt","icon.ico","uninstall.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "missing after install: $f" }
          }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").MaeGuard
          if (-not $run) { throw "autostart not registered" }
          $un = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MaeGuard"
          if ($un.DisplayName -ne "매가드") { throw "uninstall entry wrong: $($un.DisplayName)" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\매가드\매가드.lnk")) { throw "start menu shortcut missing" }
          Write-Host "install OK: $run"

          $p = Start-Process "$dir\MaeGuard.exe" -ArgumentList "--tray" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "MaeGuard exited early (code $($p.ExitCode))" }
          $log = Get-Content "$env:USERPROFILE\.maeguard\log.txt" -Raw
          Write-Host $log
          if ($log -notmatch "감시 시작") { throw "watcher did not start" }
          Stop-Process -Id $p.Id -Force

          Start-Process "$dir\uninstall.exe" -ArgumentList "/S","_?=$dir" -Wait
          Remove-Item "$dir\uninstall.exe" -ErrorAction SilentlyContinue
          if (Test-Path "$dir\MaeGuard.exe") { throw "exe left after uninstall" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").MaeGuard) { throw "autostart left after uninstall" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MaeGuard") { throw "uninstall entry left" }
          Write-Host "uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: MaeGuard
          path: |
            dist/MaeGuard.exe
            dist/MaeGuard_Setup_*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 매가드 ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 설치
            1. 아래 **Assets** 에서 `MaeGuard_Setup_1.4.0.exe` 를 받아 실행하세요.
            2. "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행** 을 누르세요. (아직 코드 서명이 없어서 뜹니다)
            3. 설치가 끝나면 시계 옆 트레이에서 자동으로 보호를 시작합니다.

            설치 없이 쓰려면 `MaeGuard.exe` 를 받아 바로 실행해도 됩니다.

            ## 참고
            - 베타 버전입니다. 문제가 있으면 [Issues](https://github.com/MSHwild/megad/issues) 에 남겨주세요.
            - Windows Defender와 함께 사용하세요.
            - MalwareBazaar · VirusTotal 연동은 설정에서 무료 키를 넣으면 켜집니다.
          files: |
            dist/MaeGuard.exe
            dist/MaeGuard_Setup_*.exe
